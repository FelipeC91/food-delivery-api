spring.application.name=food-delivery-api
server.port=8080
spring.docker.compose.enabled=true

spring.docker.compose.file=compose.yaml
spring.datasource.username=root
spring.datasource.password=verysecret
spring.datasource.url=jdbc:mysql://localhost/food-delivery-api-db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.hibernate.ddl-auto=validate

#FLYWAY
spring.flyway.locations=classpath:db/migration,classpath:db/dev_import
spring.flyway.clean-on-validation-error=true

#spring.datasource.hikari.maximum-pool-size=5
#spring.datasource.hikari.minimum-idle=3
#spring.datasource.hikari.idle-timeout=10000

#JACKSON
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-ignored-properties=true

#logging.level.root=INFO
#logging.level.com.fasterxml.jackson=DEBUG
#logging.level.com.fasterxml.jackson.databind=DEBUG
#logging.level.com.fasterxml.jackson.core=DEBUG

logging.level.org.springframework.http.converter.json=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation=TRACE
spring.mvc.log-request-details=true

application.storage.local.root-directory=/home/felipe-campos/Documents/dev/food-delivery-api/src/main/resources/img/


#AMAZON /S3
application.storage.aws-s3.access-key=
application.storage.aws-s3.secret=
application.storage.aws-s3.region=
application.storage.aws-s3.bucket=
application.storage.aws-s3.bucket-directory=

#JMS
spring.mail.host=smtp.mailgun.org
spring.mail.port=587
spring.mail.username=
spring.mail.password=
#spring.mail.smtp.auth=true
spring.mail.properties.mail.smtp.auth=true
#spring.mail.smtp.starttls.enable=true

dev.application.mail.sandbox-address=

springdoc.swagger-ui.tagsSorter=alpha

