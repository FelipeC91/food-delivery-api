spring.application.name=food-delivery-api
server.port=8080
server.compression.enabled=true
spring.docker.compose.enabled=true

spring.docker.compose.file=compose.yaml
spring.datasource.username=root
spring.datasource.password=verysecret
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}/food-delivery-api-db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.hibernate.ddl-auto=validate

#FLYWAY
spring.flyway.locations=classpath:db/migration,classpath:db/dev_import
spring.flyway.clean-on-validation-error=true

#spring.datasource.hikari.maximum-pool-size=5
#spring.datasource.hikari.minimum-idle=3
#spring.datasource.hikari.idle-timeout=10000

#JACKSON
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-ignored-properties=true

#logging.level.root=INFO
#logging.level.com.fasterxml.jackson=DEBUG
#logging.level.com.fasterxml.jackson.databind=DEBUG
#logging.level.com.fasterxml.jackson.core=DEBUG

logging.level.org.springframework.http.converter.json=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation=TRACE
spring.mvc.log-request-details=true

#application.storage.local.root-directory=/home/felipe-campos/Documents/dev/food-delivery-api/src/main/resources/img/


#AMAZON /S3
application.storage.aws-s3.access-key=
application.storage.aws-s3.secret=
application.storage.aws-s3.region=
application.storage.aws-s3.bucket=
application.storage.aws-s3.bucket-directory=

#JMS
spring.mail.host=smtp.mailgun.org
spring.mail.port=587
spring.mail.username=
spring.mail.password=
#spring.mail.smtp.auth=true
spring.mail.properties.mail.smtp.auth=true
#spring.mail.smtp.starttls.enable=true

dev.application.mail.sandbox-address=

# SWAGGER-UI
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.url=/v3/api-docs

#loggly
logging.loggly.token=


spring.security.oauth2.resourceserver.jwt.issuer-uri=http://127.0.0.1:8080
# WHEN USING OPAQUE TOKEN STRATEGY
#spring.security.oauth2.resourceserver.opaque-token.introspection-uri=
#spring.security.oauth2.resourceserver.opaque-token.client-id=
#spring.security.oauth2.resourceserver.opaque-token.client-secret=

#spring.redis.database=0
#spring.redis.host=127.0.0.1
#spring.redis.port=6379
#spring.redis.timeout=60000

authorization-server.rsa-key-pair.keyStorePassword=
authorization-server.rsa-key-pair.keyPairAlias=
authorization-server.rsa-key-pair.jksFilePath=classpath:cert/food-delivery_auth-keys.jks

springdoc.swagger-ui.oauth.usePkceWithAuthorizationCodeGrant=true
springdoc.swagger-ui.oauth.clientId=food-delivery-swagger-ui

springdoc.swagger-ui.oauth.authorization-url=/oauth2/authorize
springdoc.swagger-ui.oauth.token-url=/oauth2/token

#ACTUATOR
management.endpoints.web.exposure.include=actuator,health,metrics,prometheus,info

#RATE LIMIT
bucket4j.enabled=true
bucket4j.filter-config-caching-enabled=true
bucket4j.filter-config-cache-name=filterConfigCache
bucket4j.filters[0].id=filter1
bucket4j.filters[0].filter-order=100
bucket4j.filters[0].cache-name=buckets
bucket4j.filters[0].url=^/api/v1(/.*)?$
bucket4j.filters[0].major-version=1
bucket4j.filters[0].rate-limits[0].tokens-inheritance-strategy=reset
bucket4j.filters[0].rate-limits[0].skip-condition=getRequestURI().contains('filter')
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=30
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=5
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes
bucket4j.filters[0].rate-limits[0].bandwidths[0].refill-speed=interval

bucket4j.cache-to-use=hazelcast-spring
spring.cache.type=hazelcast
spring.hazelcast.config=classpath:hazelcast.xml