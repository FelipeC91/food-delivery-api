spring.docker.compose.enabled=true

spring.docker.compose.file=compose.yaml
spring.datasource.username=root
spring.datasource.password=verysecret
spring.datasource.url=jdbc:mysql://localhost/food-delivery-api-db_test_suite?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.clean-on-validation-error=false
application.storage.aws-s3.access-key=test-access-key
application.storage.aws-s3.secret=test-secret-key
application.storage.aws-s3.region=us-east-1

#spring.datasource.hikari.maximum-pool-size=1

spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-ignored-properties=true

logging.level.org.springframework.http.converter.json=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation=TRACE
spring.mvc.log-request-details=true